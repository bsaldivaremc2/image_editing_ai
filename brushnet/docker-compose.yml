services:
  brushnet:
    build: .
    image: imageediting/brushnet:latest
    container_name: brushnet
    ports:
      - "7863:7863"    # Gradio Web UI
      - "8003:8003"    # FastAPI REST API + Swagger
    volumes:
      - iclight_hf_cache:/root/.cache/huggingface   # shared with IC-Light (SD 1.5 already cached)
      - ./output:/output
      - ./input:/workspace/input
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  iclight_hf_cache:
    external: true   # reuse IC-Light's volume — SD 1.5 already downloaded there
