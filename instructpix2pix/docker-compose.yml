services:
  instructpix2pix:
    build: .
    image: imageediting/instructpix2pix:latest
    container_name: instructpix2pix
    ports:
      - "7860:7860"   # Gradio Web UI
      - "8000:8000"   # FastAPI REST API + Swagger docs
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./output:/workspace/output
      - ./input:/workspace/input
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local
